<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Teacher Recorder</title>
  <link rel="icon" href="../icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <style>
    body { overflow: auto; }
    .rec-page { max-width: 1040px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 32px; }
    .rec-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
    .rec-top h1 { font-size: 30px; margin: 0; font-weight: 800; line-height: 1; }
    .rec-top p { margin: 4px 0 0; color: var(--muted); font-weight: 600; }
    .rec-top .grow { flex: 1; min-width: 200px; }
    .publish { --c: var(--blue); --cd: var(--blue-d); min-height: 54px; width: auto; padding: 0 20px; font-size: 19px; font-weight: 800; }
    .publish svg { width: 22px; height: 22px; stroke-width: 2.6; }

    .meter-row { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .meter-row .track { height: 12px; }
    .meter-row b { font-size: 16px; white-space: nowrap; color: var(--ink-soft); }

    .rec-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
    @media (max-width: 760px) { .rec-layout { grid-template-columns: 1fr; } }

    .studio {
      background: var(--surface); border-radius: 28px; padding: 20px;
      box-shadow: 0 4px 0 var(--line), 0 18px 36px -16px rgba(47,41,64,.25);
      display: flex; flex-direction: column; align-items: center; gap: 14px; position: sticky; top: 16px;
    }
    .studio-letter {
      width: min(230px, 60vw); aspect-ratio: 118/138; background: #fffde8; border-radius: 24px;
      display: grid; place-items: center; border: 2.5px dashed var(--line);
    }
    .studio-letter img { width: 90%; height: 90%; object-fit: contain; }
    .studio-name { font-size: 22px; font-weight: 800; margin: -4px 0 0; }
    .studio-name small { color: var(--muted); font-weight: 600; font-size: 16px; margin-left: 6px; }

    .rec-btn {
      width: 104px; height: 104px; border-radius: 50%; background: #ff5a5f; color: #fff; position: relative;
      box-shadow: 0 6px 0 #d63c42, 0 14px 26px -8px #d63c42; display: grid; place-items: center;
      transition: transform .1s, box-shadow .1s;
    }
    .rec-btn:active { transform: translateY(5px); box-shadow: 0 1px 0 #d63c42; }
    .rec-btn .dot { width: 38px; height: 38px; border-radius: 50%; background: #fff; transition: border-radius .2s, width .2s, height .2s; }
    .rec-btn.live .dot { width: 32px; height: 32px; border-radius: 8px; }
    .rec-btn .ring { position: absolute; inset: -10px; border-radius: 50%; border: 4px solid #ff5a5f; opacity: 0; }
    .rec-btn.live .ring { opacity: .5; transform: scale(var(--lvl, 1)); transition: transform .08s; }
    .rec-hint { color: var(--muted); font-weight: 700; font-size: 16px; min-height: 22px; text-align: center; }
    .rec-hint b { color: #e2464b; }

    .review { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 10px; width: 100%; }
    .review button { min-height: 70px; border-radius: 20px; font-weight: 800; font-size: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
    .review svg { width: 26px; height: 26px; stroke-width: 2.8; }
    .b-play { background: var(--blue-l); color: var(--blue-d); box-shadow: 0 4px 0 #c6dcf7; }
    .b-redo { background: #f6efe5; color: var(--ink-soft); box-shadow: 0 4px 0 var(--line); }
    .b-ok { background: var(--green); color: #fff; box-shadow: 0 5px 0 var(--green-d); }
    .review button:active { transform: translateY(4px); box-shadow: none; }
    .saved-row { display: flex; gap: 10px; align-items: center; }
    .saved-badge { display: inline-flex; align-items: center; gap: 6px; background: var(--green-l); color: var(--green-d); font-weight: 800; padding: 6px 14px; border-radius: 999px; }
    .saved-badge svg { width: 18px; height: 18px; stroke-width: 3; }
    .keys { color: var(--muted); font-size: 13px; font-weight: 600; text-align: center; }
    .keys kbd { background: #f6efe5; border-radius: 6px; padding: 0 6px; font: inherit; font-weight: 800; color: var(--ink-soft); }

    .rec-grid .tile { cursor: pointer; }
    .rec-grid .tile.done { background: #fff; }
    .rec-grid .tile.done .tick { display: grid; }
    .rec-grid .tile.current { box-shadow: 0 0 0 3px var(--coral), 0 4px 10px rgba(255,138,76,.4); transform: scale(.93); z-index: 1; }
    .rec-grid .tile:not(.done) img { opacity: .55; }

    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0;
      background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 16px; font-weight: 700; max-width: calc(100% - 32px);
      transition: opacity .2s, transform .2s; z-index: 50; text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%); }
    .toast.bad { background: #d63c42; }
    .mic-error { background: #fff0f0; color: #b3211b; border-radius: 16px; padding: 12px 14px; font-weight: 700; text-align: center; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.8l4.4 4.4L19.2 7.4"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></symbol>
      <symbol id="i-again" viewBox="0 0 24 24"><path d="M19.6 13.5a7.8 7.8 0 1 1-2.3-6.9M19.5 3.5v4.4h-4.4"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 16V4.5M7 9l5-5 5 5M4.5 15v3.5A1.5 1.5 0 0 0 6 20h12a1.5 1.5 0 0 0 1.5-1.5V15"/></symbol>
    </defs>
  </svg>

  <div class="rec-page">
    <div class="rec-top">
      <div class="grow">
        <h1>Record your voice</h1>
        <p>Say each letter the way you teach it. Only recordings you confirm go into the app.</p>
      </div>
      <button class="big-btn publish" id="publish"><svg><use href="#i-up"/></svg>Publish to app</button>
    </div>

    <div class="meter-row">
      <div class="track"><div class="track-fill" id="doneFill"></div></div>
      <b id="doneCount">0 of 30 recorded</b>
    </div>

    <div class="rec-layout">
      <div class="studio" id="studio">
        <div class="studio-letter"><img id="sImg" alt=""></div>
        <p class="studio-name" id="sName"></p>

        <div class="mic-error hidden" id="micError"></div>

        <div id="stateRecord" class="studio-state">
          <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
            <button class="rec-btn" id="recBtn" aria-label="Record"><span class="ring"></span><span class="dot"></span></button>
            <div class="rec-hint" id="recHint">Tap to record</div>
            <div class="saved-row hidden" id="savedRow">
              <span class="saved-badge"><svg><use href="#i-check"/></svg>Saved</span>
              <button class="chip" id="playSaved"><svg style="fill:currentColor"><use href="#i-play"/></svg>Play saved</button>
            </div>
          </div>
        </div>

        <div id="stateReview" class="studio-state hidden" style="width:100%">
          <div class="review">
            <button class="b-play" id="playTake"><svg style="fill:currentColor"><use href="#i-play"/></svg>Play</button>
            <button class="b-redo" id="redo"><svg><use href="#i-again"/></svg>Redo</button>
            <button class="b-ok" id="confirm"><svg><use href="#i-check"/></svg>Confirm</button>
          </div>
          <p class="rec-hint" style="margin-top:12px">Listen first. Redo if it's not right, Confirm if it is.</p>
        </div>

        <p class="keys">Keyboard: <kbd>Space</kbd> record/stop · <kbd>P</kbd> play · <kbd>R</kbd> redo · <kbd>Enter</kbd> confirm</p>
      </div>

      <div>
        <div class="pick-grid rec-grid" id="recGrid"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../pages.js"></script>
  <script>
  (() => {
    const page = window.QAIDA_PAGES[0], L = page.letters;
    const $ = (id) => document.getElementById(id);
    const MAX_SECONDS = 5;
    let recorded = new Set(), cur = 0, stream = null, rec = null, chunks = [], take = null, takeUrl = null;
    let state = "idle", stopTimer = null, meterRaf = null, player = new Audio();

    function toast(msg, bad) {
      const t = $("toast"); t.textContent = msg; t.classList.toggle("bad", !!bad); t.classList.add("show");
      clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 3200);
    }

    // ---------- grid ----------
    const grid = $("recGrid");
    grid.style.setProperty("--cols", page.cols);
    L.forEach((l, i) => {
      const t = document.createElement("button");
      t.className = "tile"; t.dataset.i = i;
      t.innerHTML = `<img src="../${l.img}" alt="${l.name}"><span class="tick"><svg><use href="#i-check"/></svg></span>`;
      t.onclick = () => { if (state === "recording") return; select(i); };
      grid.appendChild(t);
    });

    function paint() {
      grid.querySelectorAll(".tile").forEach((t) => {
        const i = +t.dataset.i;
        t.classList.toggle("done", recorded.has(i));
        t.classList.toggle("current", i === cur);
      });
      $("doneFill").style.width = (recorded.size / L.length) * 100 + "%";
      $("doneCount").textContent = recorded.size === L.length ? "All 30 recorded!" : `${recorded.size} of ${L.length} recorded`;
    }

    function select(i) {
      cur = i; discardTake(); setState("idle");
      $("sImg").src = "../" + L[i].img;
      $("sName").innerHTML = `${L[i].name}<small>${i + 1} of ${L.length}</small>`;
      paint();
    }

    function setState(s) {
      state = s;
      $("stateRecord").classList.toggle("hidden", s === "review" || s === "saving");
      $("stateReview").classList.toggle("hidden", !(s === "review" || s === "saving"));
      $("recBtn").classList.toggle("live", s === "recording");
      $("savedRow").classList.toggle("hidden", !(s === "idle" && recorded.has(cur)));
      $("recHint").innerHTML = s === "recording" ? `<b>Recording…</b> tap to stop` :
        recorded.has(cur) ? "Tap to record again" : "Tap to record";
      $("confirm").disabled = s === "saving";
      $("confirm").lastChild.textContent = s === "saving" ? "Saving…" : "Confirm";
    }

    function discardTake() {
      player.pause();
      if (takeUrl) URL.revokeObjectURL(takeUrl);
      take = null; takeUrl = null;
    }

    // ---------- microphone ----------
    async function ensureMic() {
      if (stream) return true;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
        $("micError").classList.add("hidden");
        return true;
      } catch (e) {
        $("micError").textContent = "The microphone is blocked. Allow microphone access for this page, then try again.";
        $("micError").classList.remove("hidden");
        return false;
      }
    }

    function pickType() {
      const types = ["audio/webm;codecs=opus", "audio/mp4", "audio/ogg;codecs=opus", "audio/webm"];
      return types.find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
    }

    async function startRec() {
      if (!(await ensureMic())) return;
      discardTake();
      chunks = [];
      const type = pickType();
      rec = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
      rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
      rec.onstop = () => {
        cancelAnimationFrame(meterRaf);
        take = new Blob(chunks, { type: rec.mimeType || type || "audio/webm" });
        takeUrl = URL.createObjectURL(take);
        setState("review");
        playTake();
      };
      rec.start();
      setState("recording");
      meter();
      stopTimer = setTimeout(stopRec, MAX_SECONDS * 1000);
    }

    function stopRec() {
      clearTimeout(stopTimer);
      if (rec && rec.state === "recording") rec.stop();
    }

    function meter() {
      try {
        const ctx = meter.ctx || (meter.ctx = new AudioContext());
        const src = ctx.createMediaStreamSource(stream), an = ctx.createAnalyser();
        an.fftSize = 512; src.connect(an);
        const buf = new Uint8Array(an.fftSize);
        const tick = () => {
          an.getByteTimeDomainData(buf);
          let peak = 0; for (const v of buf) peak = Math.max(peak, Math.abs(v - 128));
          $("recBtn").style.setProperty("--lvl", 1 + Math.min(peak / 128, 1) * 0.5);
          if (state === "recording") meterRaf = requestAnimationFrame(tick); else src.disconnect();
        };
        tick();
      } catch {}
    }

    function play(url) { player.pause(); player.src = url; player.currentTime = 0; player.play().catch(() => {}); }
    function playTake() { if (takeUrl) play(takeUrl); }

    async function confirmTake() {
      if (!take || state === "saving") return;
      setState("saving");
      try {
        const r = await fetch(`/api/save?i=${cur}`, { method: "POST", body: take, headers: { "Content-Type": take.type } });
        const d = await r.json();
        if (!d.ok) throw new Error(d.message);
        recorded = new Set(d.recorded);
        discardTake();
        toast(`${L[cur].name} saved`);
        const next = L.findIndex((_, i) => i > cur && !recorded.has(i));
        const anyLeft = L.findIndex((_, i) => !recorded.has(i));
        select(next !== -1 ? next : anyLeft !== -1 ? anyLeft : cur);
        if (recorded.size === L.length) toast("All 30 recorded! Press Publish to app when you're happy.");
      } catch (e) {
        setState("review");
        toast("Couldn't save: " + (e.message || "is the recorder still running?"), true);
      }
    }

    $("recBtn").onclick = () => (state === "recording" ? stopRec() : startRec());
    $("playTake").onclick = playTake;
    $("redo").onclick = () => { discardTake(); startRec(); };
    $("confirm").onclick = confirmTake;
    $("playSaved").onclick = () => play(`../audio/${String(cur).padStart(2, "0")}.mp3?t=${Date.now()}`);

    $("publish").onclick = async () => {
      const b = $("publish"); b.disabled = true;
      try {
        const r = await fetch("/api/publish", { method: "POST" });
        const d = await r.json();
        toast(d.message, !d.ok);
      } catch { toast("Couldn't reach the recorder. Is it still running?", true); }
      b.disabled = false;
    };

    document.addEventListener("keydown", (e) => {
      if (e.repeat) return;
      if (e.code === "Space") { e.preventDefault(); if (state === "recording") stopRec(); else if (state !== "saving") startRec(); }
      else if (e.key.toLowerCase() === "p") state === "review" ? playTake() : recorded.has(cur) && $("playSaved").click();
      else if (e.key.toLowerCase() === "r" && state === "review") $("redo").click();
      else if (e.key === "Enter" && state === "review") { e.preventDefault(); confirmTake(); }
    });

    // ---------- start ----------
    fetch(`../audio/index.json?t=${Date.now()}`).then((r) => r.ok ? r.json() : { recorded: [] }).catch(() => ({ recorded: [] }))
      .then((d) => {
        recorded = new Set(d.recorded || []);
        const first = L.findIndex((_, i) => !recorded.has(i));
        select(first === -1 ? 0 : first);
      });
  })();
  </script>
</body>
</html>
